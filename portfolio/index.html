<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시각디자이너 장소은의 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<noscript><style>nav{transform:none!important;opacity:1!important;visibility:visible!important}</style></noscript>
</head>
<body>

<!-- ============ NAV: 상단 메뉴 (href="#id"는 아래 각 섹션 id와 연결) ============ -->
<nav>
  <a class="nav-brand" href="#top"><b>SOEUN JANG</b><span>Graphic Designer Portfolio</span></a>
  <ul><li><a href="#skills">ABOUT</a></li><li><a href="#project">PROJECT</a></li><li><a href="#video">VIDEO</a></li><li><a href="#contact">CONTACT</a></li></ul>
</nav>

<!-- ============ HERO: 첫 화면 (배경 이미지는 assets/hero-a.jpg, hero-b.jpg) ============ -->
<header class="hero" id="top">
  <div class="hero-stage">
    <div class="hero-a" role="img" aria-label="파란 하늘과 붉은 원, 구름과 건물이 있는 콜라주 이미지"></div>
    <div class="hero-b" aria-hidden="true"></div>
    <div class="hero-band" aria-hidden="true"></div>
  </div>
  <h1 class="sr-only">Portfolio - A designer who finds stories in small details.</h1>
</header>

<!-- ============ SKILLS: 내용은 JS의 skills 배열로 자동 생성 ============ -->
<section id="skills" aria-label="소개 (준비 중)"><div class="blank"></div></section>

<!-- ============ PROJECT: 9개씩 3페이지 좌우 드래그 슬라이더 (카드/페이지는 JS의 projects 배열로 자동 생성) ============ -->
<section id="project">
  <h2>PROJECT</h2>
  <div class="pview" id="projectView" role="region" aria-label="프로젝트 목록 (좌우로 드래그)">
    <div class="ptrack" id="projectTrack"></div>
  </div>
  <div class="vbar"><span class="dg" id="pDots" aria-label="프로젝트 페이지"></span></div>
</section>

<!-- ============ VIDEO: 영상 슬라이더 (영상 ID는 JS의 wide / shorts 배열) ============ -->
<section id="video">
  <h2>VIDEO</h2>
  <div class="vwrap">
    <button class="varrow" id="vPrev" aria-label="이전 영상">&#8249;</button>
    <div class="vview"><div class="vtrack" id="vTrack"></div></div>
    <button class="varrow" id="vNext" aria-label="다음 영상">&#8250;</button>
  </div>
  <div class="vbar"><span class="dg" id="vDotsW" aria-label="16:9 영상"></span><i class="dsep"></i><span class="dg" id="vDotsS" aria-label="숏츠 영상"></span></div>
</section>

<!-- ============ CONTACT: 이메일·전화번호는 여기서 직접 수정 ============ -->
<section id="contact" class="contact">
  <h2>CONTACT</h2>
  <p><span>E-MAIL</span>your-email@example.com</p>
  <p><span>TEL</span>+82 10 0000 0000</p>
</section>

<!-- ============ 프로젝트 상세 팝업 (내용은 JS가 채움) ============ -->
<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dhead">
    <div><h3 id="dTitle"></h3><small id="dCat"></small></div>
    <div><button class="dbtn" id="dPrev" aria-label="이전 프로젝트">←</button> <button class="dbtn" id="dNext" aria-label="다음 프로젝트">→</button> <button class="dbtn" id="dClose">닫기</button></div>
  </div>
  <div class="dimgs" id="dImgs"></div>
</dialog>

<footer>© 2026 JANG SO EUN. All rights reserved.</footer>

<script src="script.js"></script>

</body>
</html>
